name: publish-pypi

# Publishes the sdist+wheel to PyPI whenever a GitHub Release is published.
# Setup (one-time, pick one):
#   A) API token: create a token at https://pypi.org/manage/account/token/
#      (scope it to project "atomic-forge"), add it as the repo secret
#      PYPI_API_KEY. This workflow works as-is.
#   B) Trusted publishing (no token): configure a pending publisher on PyPI
#      (project atomic-forge, this workflow filename, environment pypi),
#      then replace the `password` block with `environment: pypi` +
#      `permissions: {id-token: write}` and remove `password`.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install -q build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_KEY != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_KEY }}
          verify-metadata: true