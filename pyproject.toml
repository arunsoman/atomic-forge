[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-forge"
version = "0.1.1"
description = "An agentic generate -> test -> repair loop for LLM code generation, with a resumable checkpoint store and a SEARCH/REPLACE patch engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arun Soman" }]
keywords = ["llm", "codegen", "agent", "coding-agent", "repair-loop", "swe-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atomic-forge = "atomic_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Scope collection to the real suite. Without this, a bare `pytest` from
# the repo root also walks benchmarks/ — whose cases/*/seed/test_mod.py
# fixtures intentionally share a basename across cases (each is a
# standalone extracted module, see benchmarks/README.md) and collide
# under pytest's rootdir-based import when collected together.
testpaths = ["tests"]
